name: Deploy to all servers

on:
  push:
    branches:
      - main          # deploy automatically on every push to main

  workflow_dispatch:  # also allow manual trigger from the GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reuse downloaded packages so a flaky GitHub API does not block a deploy.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # GitHub's zipball API intermittently returns 504, and Composer aborts the whole
      # run rather than falling back to source — which silently blocks the deploy steps
      # below. Retry, then fall back to --prefer-source before giving up.
      - name: Install PHP dependencies
        run: |
          set -e
          for attempt in 1 2 3; do
            if composer install --no-dev --optimize-autoloader --no-interaction; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::warning::composer install failed 3x on dist, trying --prefer-source"
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-source
              break
            fi
            echo "composer install failed (attempt $attempt) — retrying in 15s"
            sleep 15
          done

      # Never let a half-finished install reach the servers.
      - name: Verify dependencies installed
        run: |
          test -f vendor/autoload.php || { echo "::error::vendor/autoload.php missing — aborting deploy"; exit 1; }
          test -d vendor/phpmailer || { echo "::error::phpmailer missing — aborting deploy"; exit 1; }
          test -d vendor/dompdf   || { echo "::error::dompdf missing — aborting deploy"; exit 1; }
          echo "Dependencies OK"

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      # ── Server 1: gambia2026.earthhouraward.org (one.com) ──────────────
      - name: Deploy → gambia2026.earthhouraward.org
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          lftp -u "${SFTP_USER},${SFTP_PASS}" "sftp://${SFTP_HOST}:${SFTP_PORT}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore --exclude-glob *.example.php . ${SFTP_PATH};
            quit
          "

      # ── Server 2: gambia2026.ngocsocd.org (Truehost — SSH on port 1624) ──
      - name: Deploy → gambia2026.ngocsocd.org
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST_2 }}
          SFTP_USER: ${{ secrets.SFTP_USER_2 }}
          SFTP_PASS: ${{ secrets.SFTP_PASS_2 }}
          SFTP_PATH: ${{ secrets.SFTP_PATH_2 }}
        run: |
          lftp -u "${SFTP_USER},${SFTP_PASS}" "sftp://${SFTP_HOST}:1624" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore --exclude-glob *.example.php --exclude db.php --exclude mail_config.php . ${SFTP_PATH};
            quit
          "
